name = "sitetask-cloud-bridge"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
[observability]
enabled = false
[[d1_databases]]
binding = "DB"
database_name = "sitetask-local"
database_id = "00000000-0000-0000-0000-000000000000"
[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "DbCoordinator"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DbCoordinator"]
[triggers]
crons = ["0 * * * *"]
